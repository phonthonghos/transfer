let db=JSON.parse(JSON.stringify(DEMO)),tab='dashboard',filter='',busy=false,dateRange={from:'',to:''},sortState={key:'',direction:1},editing=null;
const real=!!(window.google&&google.script&&google.script.run),localDemo=location.protocol==='file:'||['localhost','127.0.0.1','::1'].includes(location.hostname),monthNames=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'],weekdays=['จ','อ','พ','พฤ','ศ','ส','อา'];

function pad2(n){return String(n).padStart(2,'0')}
function isLeapYear(y){return y%4===0&&(y%100!==0||y%400===0)}

function makeISO(y,m,d){return `${String(y).padStart(4,'0')}-${pad2(m)}-${pad2(d)}`}

function parseISO(value){const match=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(value||''));if(!match)return null;const y=Number(match[1]),m=Number(match[2]),d=Number(match[3]);return validParts(y,m,d)?{y,m,d}:null}

function view(n){tab=n;editing=null;filter='';document.querySelectorAll('#sidebar-nav button').forEach(b=>{const active=b.dataset.tab===n;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});closeMobileSidebar();render()}
function stats(claims=db.claims.filter(active),transfers=db.transfers.filter(active),allocations=db.allocations.filter(active)){const approved=total(claims,'approved'),paid=total(allocations,'amount'),incoming=total(transfers,'amount');return {approved,paid,incoming,pending:approved-paid,unmatched:incoming-paid}}
function datePicker(id,label,iso='',required=false,fieldClass=''){return `<div class="field ${fieldClass}"><span>${label}${required?' *':''}</span><div class="date-picker" data-date-picker data-date-id="${id}" data-required="${required?'true':'false'}"><input id="${id}-display" class="date-display" type="text" autocomplete="off" inputmode="numeric" placeholder="วว/ดด/ปปปป" value="${esc(isoToThai(iso))}" aria-label="${label} (พ.ศ.)" aria-required="${required?'true':'false'}" aria-haspopup="dialog" aria-expanded="false"><input type="hidden" ${id==='filterFrom'||id==='filterTo'?`data-date-value="${id}"`:`name="${id}"`} value="${esc(iso)}"><button type="button" class="date-trigger" aria-label="เปิดปฏิทิน ${label}" aria-expanded="false">▦</button><div class="date-popover" role="dialog" aria-label="เลือก${label}" hidden><div class="calendar-head"><button type="button" data-cal-move="-1" aria-label="เดือนก่อน">‹</button><select data-cal-month aria-label="เดือน"></select><input data-cal-year type="number" min="544" max="10542" step="1" aria-label="ปี พ.ศ."><button type="button" data-cal-move="1" aria-label="เดือนถัดไป">›</button></div><div class="weekday-row">${weekdays.map(d=>`<span>${d}</span>`).join('')}</div><div class="calendar-days" data-cal-days></div><div class="date-shortcuts"><button type="button" data-cal-today>วันนี้</button><button type="button" data-cal-clear>ล้างวันที่</button></div></div></div><span class="date-error" aria-live="polite"></span></div>`}
function dateRangeFilters(note){return `<div class="date-range"><div class="date-range-title">กรองตามช่วงวันที่</div>${datePicker('filterFrom','ตั้งแต่',dateRange.from)}${datePicker('filterTo','ถึง',dateRange.to)}<span class="note">${note}</span><p id="range-error" class="range-error hide">วันเริ่มต้นต้องไม่อยู่หลังวันสิ้นสุด</p></div>`}
function scopedAllocationsForClaims(claims){const ids=new Set(claims.map(c=>c.id));return db.allocations.filter(a=>active(a)&&ids.has(a.claimId))}
function scopedAllocationsForTransfers(transfers){const ids=new Set(transfers.map(t=>t.id));return db.allocations.filter(a=>active(a)&&ids.has(a.transferId))}
function reportStats(claims,transfers){const claimAllocations=scopedAllocationsForClaims(claims),transferAllocations=scopedAllocationsForTransfers(transfers),approved=total(claims,'approved'),paid=total(claimAllocations,'amount'),incoming=total(transfers,'amount'),transferPaid=total(transferAllocations,'amount');return {approved,paid,incoming,transferPaid,pending:approved-paid,unmatched:incoming-transferPaid,claimAllocations,transferAllocations}}
function dashboard(){const claims=filteredClaims(),transfers=filteredTransfers(),s=reportStats(claims,transfers),funds=[...new Set(claims.map(c=>c.fund))].map(f=>({f,amount:claims.filter(c=>c.fund===f).reduce((n,c)=>n+Number(c.approved),0)})).sort((a,b)=>b.amount-a.amount),max=Math.max(1,...funds.map(x=>x.amount));const cards=[['ยอดอนุมัติ / ตั้งเบิก',s.approved,'จากงวดที่งานเคลมบันทึก'],['ยอดจับคู่รับแล้ว',s.paid,'รวมเงินรับของงวดที่เลือก'],['ยอดอนุมัติคงเหลือ',s.pending,'รอรับหรือรับยังไม่ครบ'],['ยอดรับโอนยังไม่จับคู่',s.unmatched,'เงินเข้าแล้ว แต่ยังระบุงวดไม่ครบ']];return `${dateRangeFilters('กรองงวดด้วยวันที่ส่งใบฎีกา และกรองเงินโอนด้วยวันที่เงินเข้า; ยอดรับแล้วนับทุกการรับของงวดที่เลือก')}<div class="kpis">${cards.map(([title,v,sub])=>`<div class="kpi"><div class="title">${title}</div><strong>${money(v)}</strong><div class="sub">${sub}</div></div>`).join('')}</div><div class="panels"><section class="panel"><h2>ยอดอนุมัติตามกองทุน</h2><div class="bars">${funds.length?funds.map(x=>`<div class="barline"><span>${esc(x.f)}</span><div class="track"><div class="fill" style="width:${100*x.amount/max}%"></div></div><b class="money">${money(x.amount)}</b></div>`).join(''):'ยังไม่มีข้อมูล'}</div></section><section class="panel"><h2>ภาพรวมการรับเงิน</h2><div class="bars">${[['จัดสรรแล้ว',s.paid,'green'],['ยังคงเหลือ',s.pending,'']].map(([l,n,color])=>`<div class="barline"><span>${l}</span><div class="track"><div class="fill ${color}" style="width:${100*n/Math.max(1,s.approved)}%"></div></div><b class="money">${money(n)}</b></div>`).join('')}</div><div class="hint">ยอดรับโอนเข้าบัญชีในช่วงที่เลือก ${money(s.incoming)} บาท · อัตราจับคู่เทียบยอดอนุมัติ ${(100*s.paid/Math.max(1,s.approved)).toFixed(1)}% (ไม่ใช่อัตราจ่ายชดเชยจากยอดเคลมตั้งต้น)</div></section></div><section class="panel" style="margin-top:16px"><h2>งวดที่ยังรับเงินไม่ครบ</h2>${claimsTable(claims.filter(c=>scopedRemaining(c,s.claimAllocations)>0.005),s.claimAllocations)}</section>${reportToolbar()}${reportTables()}`}
function restoreButton(type,id){return `<button type="button" class="primary secondary" data-restore="${type}" data-id="${esc(id)}">คืนสถานะ</button>`}
function actionButtons(type,id){return `<button type="button" class="primary secondary" data-edit="${type}" data-id="${esc(id)}">แก้ไข</button> <button type="button" class="primary secondary" data-cancel="${type}" data-id="${esc(id)}">ยกเลิก</button>`}
function claimsTable(arr,allocations=db.allocations,actions=false){const rows=sortRows(arr);return `<div class="tablebox"><table><thead><tr><th>กองทุน</th><th>ประเภท</th><th>งวดตั้งเบิก</th><th>${sortHeader('วันที่ส่งใบฎีกา','submittedDate')}</th><th class="money">ยอดตั้งเบิก</th><th class="money">รับแล้ว</th><th class="money">คงเหลือ</th><th>สถานะ</th>${actions?'<th>จัดการ</th>':''}</tr></thead><tbody>${rows.length?rows.map(c=>{const paid=scopedAllocClaim(c.id,allocations),r=active(c)?Math.max(0,Number(c.approved)-paid):0;return `<tr><td>${esc(c.fund)}</td><td>${esc(c.service)}</td><td>${esc(c.period)}</td><td>${formatDate(c.submittedDate)}</td><td class="money">${money(c.approved)}</td><td class="money">${money(paid)}</td><td class="money">${money(r)}</td><td><span class="tag ${!active(c)?'bad':r<.005?'ok':paid>0?'warn':'bad'}">${!active(c)?'ยกเลิก':r<.005?'รับครบ':paid>0?'รับบางส่วน':'ยังไม่รับ'}</span></td>${actions?`<td>${active(c)?actionButtons('CLAIMS',c.id):restoreButton('CLAIMS',c.id)}</td>`:''}</tr>`}).join(''):`<tr><td colspan="${actions?9:8}" class="muted">ไม่มีรายการ</td></tr>`}</tbody></table></div>`}

function transferTable(arr,allocations=db.allocations,actions=false){const rows=sortRows(arr);return `<div class="tablebox"><table><thead><tr><th>รหัส</th><th>${sortHeader('วันที่เงินเข้า','bankDate')}</th><th>${sortHeader('วันที่รับเงิน','receivedDate')}</th><th>ใบเสร็จ</th><th>${sortHeader('วันที่ออกใบเสร็จ','receiptDate')}</th><th class="money">ยอดรับโอน</th><th class="money">จับคู่แล้ว</th><th class="money">ยังไม่จับคู่</th><th>บัญชี</th><th>สถานะ</th>${actions?'<th>จัดการ</th>':''}</tr></thead><tbody>${rows.length?rows.map(t=>`<tr><td>${esc(t.id)}</td><td>${formatDate(t.bankDate)}</td><td>${formatDate(t.receivedDate)}</td><td>${esc(t.receiptNo)}</td><td>${formatDate(t.receiptDate)}</td><td class="money">${money(t.amount)}</td><td class="money">${money(scopedAllocTransfer(t.id,allocations))}</td><td class="money">${money(active(t)?scopedUnmatched(t,allocations):0)}</td><td>${esc(t.account)}</td><td>${active(t)?'ใช้งาน':'ยกเลิก'}</td>${actions?`<td>${active(t)?actionButtons('TRANSFERS',t.id):restoreButton('TRANSFERS',t.id)}</td>`:''}</tr>`).join(''):`<tr><td colspan="${actions?11:10}">ไม่มีรายการ</td></tr>`}</tbody></table></div>`}

function form(type){const record=editing?.type===type?db[{CLAIMS:'claims',TRANSFERS:'transfers',ALLOCATIONS:'allocations'}[type]].find(r=>r.id===editing.id&&active(r)):null;const val=key=>esc(record?.[key]??'');const f=(key,label,inputType='text',required=false,extra='')=>`<label class="field">${label}${required?' *':''}<input name="${key}" type="${inputType}" value="${val(key)}" ${required?'required':''} ${extra}></label>`;let html='';if(type==='CLAIMS')html=f('fund','กองทุน','text',true,'list="funds"')+`<datalist id="funds">${['กรมบัญชีกลาง','สปสช.','อปท.','ประกันสังคม','กทม.','ครูเอกชน','ขสมก.','การรถไฟฯ','พ.ร.บ.'].map(x=>`<option value="${x}">`).join('')}</datalist>`+f('service','ประเภทบริการ (เช่น OPD/IPD)')+f('period','งวดที่ส่งเบิก','text',true)+f('approved','จำนวนเงินตั้งเบิก (ยอดอนุมัติแจ้งจ่าย)','number',true,'min="0.01" step="0.01"')+datePicker('submittedDate','วันที่ส่งใบฎีกาตั้งเบิก',record?.submittedDate||'',false)+f('note','หมายเหตุ');if(type==='TRANSFERS')html=datePicker('bankDate','วันที่เงินเข้า',record?.bankDate||'',true)+datePicker('receivedDate','วันที่รับเงิน',record?.receivedDate||'',false)+f('receiptNo','เลขที่ใบเสร็จ')+datePicker('receiptDate','วันที่ออกใบเสร็จ',record?.receiptDate||'',false)+f('amount','จำนวนเงินรับโอน','number',true,'min="0.01" step="0.01"')+f('account','บัญชีที่รับโอน')+f('note','หมายเหตุ');if(type==='ALLOCATIONS')html=`<label class="field">รายการเงินโอน *<select required name="transferId"><option value="">เลือกรายการ</option>${db.transfers.filter(t=>active(t)&&(unmatched(t)>.005||t.id===record?.transferId)).map(t=>`<option value="${esc(t.id)}" ${t.id===record?.transferId?'selected':''}>${formatDate(t.bankDate)} · ${money(unmatched(t))} · ${esc(t.id)}</option>`).join('')}</select></label><label class="field">งวดตั้งเบิก *<select required name="claimId"><option value="">เลือกงวด</option>${db.claims.filter(c=>active(c)&&(remaining(c)>.005||c.id===record?.claimId)).map(c=>`<option value="${esc(c.id)}" ${c.id===record?.claimId?'selected':''}>${esc(c.fund)} · ${esc(c.period)} · เหลือ ${money(remaining(c))}</option>`).join('')}</select></label>`+f('amount','จำนวนเงินที่จับคู่กับงวดนี้','number',true,'min="0.01" step="0.01"')+f('note','หมายเหตุ');return `<form class="form" id="recordForm" data-type="${type}" ${record?`data-id="${esc(record.id)}"`:''}>${html}<div class="actions"><button class="primary" type="submit">${record?'บันทึกการแก้ไข':'บันทึกรายการ'}</button>${record?'<button type="button" class="primary secondary" data-cancel-edit>ยกเลิกแก้ไข</button>':''}<span class="note" id="msg"></span></div></form>`}
function reportToolbar(){return '<div class="toolbar"><button class="primary secondary" id="csv">ส่งออก CSV</button></div>'}
function toolbar(){return `<div class="toolbar"><input id="search" placeholder="ค้นหากองทุน / งวด / รายการ..." value="${esc(filter)}"><button class="primary secondary" id="csv">ส่งออก CSV</button></div>`}
function allocationTable(arr,actions=false){const rows=sortRows(arr);return `<div class="tablebox"><table><thead><tr><th>${sortHeader('วันที่เงินเข้า','bankDate')}</th><th>รายการโอน</th><th>กองทุน</th><th>งวดที่โอนรวม</th><th class="money">จำนวนเงินที่จับคู่</th><th>สถานะ</th>${actions?'<th>จัดการ</th>':''}</tr></thead><tbody>${rows.map(a=>`<tr><td>${formatDate(transfer(a.transferId)?.bankDate)}</td><td>${esc(a.transferId)}</td><td>${esc(claim(a.claimId)?.fund)}</td><td>${esc(claim(a.claimId)?.period)}</td><td class="money">${money(a.amount)}</td><td>${active(a)?'ใช้งาน':'ยกเลิก'}</td>${actions?`<td>${active(a)?actionButtons('ALLOCATIONS',a.id):restoreButton('ALLOCATIONS',a.id)}</td>`:''}</tr>`).join('')||`<tr><td colspan="${actions?7:6}">ยังไม่มีรายการ</td></tr>`}</tbody></table></div>`}

function monthlySummaryRows(){const monthOf=iso=>/^\d{4}-\d{2}/.test(iso||'')?iso.slice(0,7):'undated';const claims=filteredClaims(),transfers=filteredTransfers(),claimAllocations=scopedAllocationsForClaims(claims),transferAllocations=scopedAllocationsForTransfers(transfers),keys=[...new Set([...claims.map(c=>monthOf(c.submittedDate)),...transfers.map(t=>monthOf(t.bankDate))])].sort();return keys.map(key=>{const cc=claims.filter(c=>monthOf(c.submittedDate)===key),tt=transfers.filter(t=>monthOf(t.bankDate)===key),approved=total(cc,'approved'),incoming=total(tt,'amount'),allocated=total(claimAllocations.filter(a=>cc.some(c=>c.id===a.claimId)),'amount'),transferAllocated=total(transferAllocations.filter(a=>tt.some(t=>t.id===a.transferId)),'amount');return {label:key==='undated'?'ไม่ระบุวันที่':`${monthNames[Number(key.slice(5))-1]} ${Number(key.slice(0,4))+543}`,approved,incoming,allocated,outstanding:approved-allocated,unallocated:incoming-transferAllocated}})}
function fundSummaryRows(){const claims=filteredClaims(),allocations=scopedAllocationsForClaims(claims);return [...new Set(claims.map(c=>c.fund))].sort((a,b)=>a.localeCompare(b,'th')).map(fund=>{const cc=claims.filter(c=>c.fund===fund),approved=total(cc,'approved'),allocated=total(allocations.filter(a=>cc.some(c=>c.id===a.claimId)),'amount');return {label:fund,approved,allocated,outstanding:approved-allocated}})}
function reportTables(){const months=monthlySummaryRows(),funds=fundSummaryRows();return `<section class="panel" style="margin-top:16px"><h2>สรุปรายเดือน</h2><div class="hint">ยอดตั้งเบิกและยอดจัดสรรอิงเดือนวันที่ส่งใบฎีกา · ยอดโอนและยอดยังไม่จัดสรรอิงเดือนวันที่เงินเข้า</div><div class="tablebox"><table><thead><tr><th>เดือน (พ.ศ.)</th><th class="money">ยอดอนุมัติ / แจ้งจ่าย</th><th class="money">ยอดโอนเข้าบัญชี</th><th class="money">ยอดจัดสรรให้งวด</th><th class="money">ยอดงวดคงค้าง</th><th class="money">ยอดโอนยังไม่จัดสรร</th></tr></thead><tbody>${months.map(r=>`<tr><td>${esc(r.label)}</td><td class="money">${money(r.approved)}</td><td class="money">${money(r.incoming)}</td><td class="money">${money(r.allocated)}</td><td class="money">${money(r.outstanding)}</td><td class="money">${money(r.unallocated)}</td></tr>`).join('')||'<tr><td colspan="6">ไม่มีรายการ</td></tr>'}</tbody></table></div></section><section class="panel" style="margin-top:16px"><h2>สรุปตามกองทุน</h2><div class="hint">เงินโอนหนึ่งรายการอาจครอบคลุมหลายกองทุน จึงแสดงยอดโอนตามวันที่เงินเข้าในสรุปรายเดือนเท่านั้น</div><div class="tablebox"><table><thead><tr><th>กองทุน</th><th class="money">ยอดอนุมัติ / แจ้งจ่าย</th><th class="money">ยอดจัดสรร</th><th class="money">ยอดงวดคงค้าง</th></tr></thead><tbody>${funds.map(r=>`<tr><td>${esc(r.label)}</td><td class="money">${money(r.approved)}</td><td class="money">${money(r.allocated)}</td><td class="money">${money(r.outstanding)}</td></tr>`).join('')||'<tr><td colspan="4">ไม่มีรายการ</td></tr>'}</tbody></table></div></section>`}
function page(){if(tab==='dashboard')return dashboard();if(tab==='claims')return `<section class="panel"><h2>งานเคลม · บันทึกยอดอนุมัติ 1 ครั้งต่องวด</h2><div class="hint">จำนวนเงินตั้งเบิกในระบบนี้ = ยอดที่กองทุนอนุมัติจ่ายหรือแจ้งว่าจะโอนแล้ว ไม่ใช่ยอดส่งเคลมตั้งต้น</div>${form('CLAIMS')}</section><section class="panel" style="margin-top:16px"><h2>ทะเบียนงวดตั้งเบิก (${filteredClaims().length})</h2>${dateRangeFilters('ใช้วันที่ส่งใบฎีกาตั้งเบิก')}${toolbar()}<div id="table">${claimsTable(filteredClaims(),db.allocations,true)}</div></section><section class="panel" style="margin-top:16px"><h2>ประวัติงวดที่ยกเลิก</h2>${claimsTable(db.claims.filter(c=>!active(c)&&isInRange(c.submittedDate)),db.allocations,true)}</section>`;if(tab==='transfers')return `<section class="panel"><h2>งานการเงิน · รับเงินเข้าบัญชีครั้งละ 1 รายการ</h2><div class="hint">กรอกยอดรวมเข้าบัญชีเพียงครั้งเดียว แม้เงินโอนนั้นครอบคลุมหลายงวดตั้งเบิก</div>${form('TRANSFERS')}</section><section class="panel" style="margin-top:16px"><h2>รายการรับโอน (${filteredTransfers().length})</h2>${dateRangeFilters('ใช้วันที่เงินเข้า')}${toolbar()}<div id="table">${transferTable(filteredTransfers(),db.allocations,true)}</div></section><section class="panel" style="margin-top:16px"><h2>ประวัติเงินโอนที่ยกเลิก</h2>${transferTable(db.transfers.filter(t=>!active(t)&&isInRange(t.bankDate)),db.allocations,true)}</section>`;if(tab==='allocations')return `<section class="panel"><h2>จับคู่เงินโอนกับงวดตั้งเบิก</h2><div class="hint">เลือกการโอน 1 ครั้ง แล้วจับคู่กับงวดที่เกี่ยวข้องทีละงวด โดยใส่เฉพาะยอดที่เป็นของงวดนั้น ระบบป้องกันยอดจัดสรรเกินยอดโอนและยอดตั้งเบิก</div>${form('ALLOCATIONS')}</section><section class="panel" style="margin-top:16px"><h2>ประวัติจับคู่งวด (${filteredAllocations().length})</h2>${dateRangeFilters('ใช้วันที่เงินเข้า')}${allocationTable(filteredAllocations(),true)}</section><section class="panel" style="margin-top:16px"><h2>ประวัติการจับคู่ที่ยกเลิก</h2>${allocationTable(db.allocations.filter(a=>!active(a)&&isInRange(transfer(a.transferId)?.bankDate)),true)}</section>`;const claims=filteredClaims(),transfers=filteredTransfers(),s=reportStats(claims,transfers),claimAllocations=s.claimAllocations,transferAllocations=s.transferAllocations;return `${dateRangeFilters('กรองงวดด้วยวันที่ส่งใบฎีกา และเงินโอนด้วยวันที่เงินเข้า')}<div class="kpis"><div class="kpi"><div class="title">งวดที่ยังไม่รับครบ</div><strong>${claims.filter(c=>scopedRemaining(c,claimAllocations)>.005).length}</strong></div><div class="kpi"><div class="title">ยอดอนุมัติรอรับ</div><strong>${money(s.pending)}</strong></div><div class="kpi"><div class="title">จำนวนรายการโอนรอจับคู่</div><strong>${transfers.filter(t=>scopedUnmatched(t,transferAllocations)>.005).length}</strong></div><div class="kpi"><div class="title">ยอดโอนรอจับคู่</div><strong>${money(s.unmatched)}</strong></div></div><section class="panel" style="margin-top:16px"><h2>งวดที่ยังรับไม่ครบ</h2>${claimsTable(claims.filter(c=>scopedRemaining(c,claimAllocations)>.005),claimAllocations)}</section><section class="panel" style="margin-top:16px"><h2>รายการเงินเข้าที่ยังจับคู่งวดไม่ครบ</h2>${transferTable(transfers.filter(t=>scopedUnmatched(t,transferAllocations)>.005),transferAllocations)}</section>${reportToolbar()}${reportTables()}`}
